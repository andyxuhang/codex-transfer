[project]
name = "codex-transfer"
version = "1.0.0"
description = "Replacement-only Windows migration utility for local Codex Desktop data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andy Xu" }]
keywords = ["codex", "chatgpt", "migration", "backup", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
codex-transfer = "codex_transfer:main"

[project.urls]
Homepage = "https://github.com/andyxuhang/codex-transfer"
Issues = "https://github.com/andyxuhang/codex-transfer/issues"

[tool.setuptools]
py-modules = ["codex_transfer", "codex_transfer_core"]
