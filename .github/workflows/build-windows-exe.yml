name: build Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and upload
        required: true
        default: v1.2.1

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned build tool
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.2

      - name: Build portable GUI executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name Codex-Transfer codex_transfer.py
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name Codex-Sidebar-Repair codex_sidebar_repair.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Codex-Transfer.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed with exit code $($process.ExitCode)" }
          $repairProcess = Start-Process -FilePath "dist\Codex-Sidebar-Repair.exe" -ArgumentList "--version" -Wait -PassThru
          if ($repairProcess.ExitCode -ne 0) { throw "Sidebar Repair smoke test failed with exit code $($repairProcess.ExitCode)" }

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist\Codex-Transfer.exe").Hash.ToLowerInvariant()
          "$hash  Codex-Transfer.exe" | Set-Content -Encoding ascii "dist\Codex-Transfer.exe.sha256.txt"
          $repairHash = (Get-FileHash -Algorithm SHA256 "dist\Codex-Sidebar-Repair.exe").Hash.ToLowerInvariant()
          "$repairHash  Codex-Sidebar-Repair.exe" | Set-Content -Encoding ascii "dist\Codex-Sidebar-Repair.exe.sha256.txt"

      - name: Attest executable build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/Codex-Transfer.exe
            dist/Codex-Sidebar-Repair.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Transfer-Windows
          path: |
            dist/Codex-Transfer.exe
            dist/Codex-Transfer.exe.sha256.txt
            dist/Codex-Sidebar-Repair.exe
            dist/Codex-Sidebar-Repair.exe.sha256.txt
          if-no-files-found: error

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ inputs.release_tag }}"
          "dist\Codex-Transfer.exe"
          "dist\Codex-Transfer.exe.sha256.txt"
          "dist\Codex-Sidebar-Repair.exe"
          "dist\Codex-Sidebar-Repair.exe.sha256.txt"
          --clobber
